name: Feature Request
description: Suggest an idea or improvement for sv-memory
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the problem you're solving so we can evaluate it together.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should sv-memory do about it?
      placeholder: Describe your idea and how it should behave...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternatives you have already tried?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, use cases, or anything else that helps.
