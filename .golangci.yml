version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocyclo
    - gocognit
    - funlen
    - revive

  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 25
    funlen:
      lines: 100
      statements: 60
    errcheck:
      exclude-functions:
        - io.Closer.Close
        - io.ReadCloser.Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - os.Remove
        - os.RemoveAll
        - (*compress/gzip.Reader).Close
        - (*archive/zip.ReadCloser).Close
        - (*github.com/svtech-code/sv-memory/internal/db.Pool).Close
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

  exclusions:
    rules:
      # Exclude cyclo/cognitive complexity and function length checks on tests
      # as they are more relaxed.
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - funlen
          - errcheck
          - revive

formatters:
  enable:
    - gofmt
    - goimports
