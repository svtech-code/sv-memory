version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocyclo
    - revive

  settings:
    gocyclo:
      min-complexity: 15
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

  exclusions:
    rules:
      # Exclude cyclo complexity, errcheck, and revive checks on tests as they are more relaxed
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - revive

formatters:
  enable:
    - gofmt
    - goimports
